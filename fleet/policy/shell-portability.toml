# Portability audit data for the shell-portability rule. It encodes the command
# and option table of the owner portability standard
# (~/.agents/standards/portability.md): shared shell must run unchanged on macOS
# (BSD userland), glibc Linux, and Alpine (BusyBox). Each [[rule]] names the
# command words it applies to and the portable replacement reported in findings.
# `options` entries are forbidden option spellings: "--long" also matches
# "--long=value", a two-character "-x" matches that short option alone, in a
# single-dash cluster, or with an attached value, and a longer "-word" matches
# the exact argument word. `letters` restricts cluster bodies to those
# characters (echo only accepts n, e and E). An entry containing a space
# matches that exact word sequence. `arguments` entries are required leading
# argument words and `patterns` are regular expressions searched in each
# argument word before any "--" operand separator.
version = 1

[[rule]]
commands = ["shasum"]
use = "sha256sum"

[[rule]]
commands = ["md5", "md5sum"]
use = "sha256sum"

[[rule]]
commands = ["nproc"]
use = "getconf _NPROCESSORS_ONLN, or os.cpu_count() in Python"

[[rule]]
commands = ["flock"]
use = "a mkdir lock directory, or Python fcntl.flock"

[[rule]]
commands = ["getopt"]
use = "the getopts shell builtin"

[[rule]]
commands = ["tac"]
use = "awk to reverse the lines, or Python"

[[rule]]
commands = ["which"]
use = "command -v"

[[rule]]
commands = ["stat"]
options = ["-c", "--format", "-f", "--file-system"]
use = "wc -c < FILE for size, find FILE -newer REF for time order, Python for owners, modes, and times"

[[rule]]
commands = ["sed"]
options = ["-i", "--in-place"]
use = "write to a temp file in the same directory, then mv"

[[rule]]
commands = ["grep"]
options = ["-P", "--perl-regexp"]
use = "grep -E, or Python"

[[rule]]
commands = ["sed", "grep"]
patterns = ['\\[sw+?|]']
use = "POSIX classes such as [[:space:]] and [[:alnum:]_], and -E with +, ? and |"

[[rule]]
commands = ["date"]
options = ["-d", "--date", "-j", "-v"]
patterns = ["%N"]
use = "date -u +%s and date -u +%Y-%m-%dT%H:%M:%SZ; Python for arithmetic and parsing"

[[rule]]
commands = ["find"]
options = ["-printf", "-regextype"]
use = "POSIX find with -exec, or Python"

[[rule]]
commands = ["sort"]
options = ["-V", "--version-sort"]
use = "POSIX sort, or Python"

[[rule]]
commands = ["du"]
options = ["-b", "--bytes"]
use = "wc -c, or Python"

[[rule]]
commands = ["readlink"]
options = ["-e", "-m"]
use = "readlink -f or realpath"

[[rule]]
commands = ["cp"]
options = ["--reflink", "-T", "--no-target-directory"]
use = "cp -a or POSIX cp"

[[rule]]
commands = ["mv"]
options = ["-T", "--no-target-directory"]
use = "POSIX mv"

[[rule]]
commands = ["ln"]
options = ["-r", "--relative"]
use = "ln -sfn or POSIX ln"

[[rule]]
commands = ["install"]
options = ["-D"]
use = "mkdir -p then install -m"

[[rule]]
commands = ["tail"]
options = ["-r"]
use = "awk to reverse the lines, or Python"

[[rule]]
commands = ["echo"]
options = ["-e", "-n"]
letters = "enE"
use = "printf"

[[rule]]
commands = ["openssl"]
arguments = ["dgst"]
use = "sha256sum"

[[rule]]
commands = ["sysctl"]
options = ["-n hw.ncpu"]
use = "getconf _NPROCESSORS_ONLN"

[exempt."joshuarli/shck"]
reason = "crates/shuck-benchmark/resources/files/ is a corpus of third-party shell scripts that the linter benchmarks parse, not shell the repository runs."
reassess = "If the benchmark corpus is replaced by scripts the repository executes."
paths = ["crates/shuck-benchmark/resources/files/*"]

[exempt."joshuarli/gh"]
reason = "Effectively upstream fork whose inherited build must stay unchanged: the non-portable shell is upstream's, and rewriting it would widen the fork's diff without a fleet consumer."
reassess = "When the fork's own changes add shell, or upstream adopts the portable spellings."

