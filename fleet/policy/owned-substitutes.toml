[exempt."joshuarli/lz".producers."laputa-systems/git-build"]
reason = "Needs HTTPS git: cargo fetches its laputa-ptytest git dependency over HTTPS with the git CLI, and git-build omits HTTPS by product decision."
reassess = "When the dependency moves to a registry release or the build stops fetching git over HTTPS."

