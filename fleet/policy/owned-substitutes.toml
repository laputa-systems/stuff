[exempt."joshuarli/kache".producers."laputa-systems/llvm-prebuilt-musl"]
reason = "kache is a compiler cache whose cc-oracle and cc-bench suites run gcc and g++ as compilers under test (crates/kache-e2e/src/cc_oracle), so its images and workflows must install the upstream gcc they cache."
reassess = "When the oracle drops gcc as a subject."

[exempt."joshuarli/crabc".producers."laputa-systems/llvm-prebuilt-musl"]
reason = "crabc pins its Alpine images and packages in compat/upstreams.toml, including build-base, clang, lld and llvm and its gcc-driven mold linker wrapper, as inputs to its recorded ABI and compatibility evidence, so the owned toolchain cannot replace them without invalidating that baseline."
reassess = "When crabc rebaselines its compatibility evidence on the owned toolchain."

[exempt."joshuarli/tf".producers."laputa-systems/python-build"]
reason = "The producer publishes no release for the Python versions tf needs: 3.14 for the pinned unicodedata 16.0.0 its table generator requires, 3.12 for the ComfyUI runtime checks, and a 3.11/3.12 support matrix; python-build ships only 3.15."
reassess = "When python-build publishes the older minors (stuff TODO STUF-123)."

[exempt."joshuarli/tf".producers."laputa-systems/node-build"]
reason = "tf's Electron app, mobile and runtime-feed jobs run Node 22 with npm lockfiles and a pinned npm; node-build ships Node 26 without npm or Corepack by product decision, so moving them is a runtime and package-manager migration of the app, not a tool swap."
reassess = "When tf moves its app and mobile builds to Node 26 with pnpm or another package manager node-build supports."

[exempt."laputa-systems/stuff".producers."laputa-systems/node-build"]
reason = "The ecosystem smoke drives the npm registry with the real npm client, and scripts/setup-dev provisions that Node with npm for local runs; node-build ships no npm by product decision. The worker runtime job already takes owned node."
reassess = "When the npm smoke takes its npm client from an owned source, or node-build ships npm."

[exempt."joshuarli/extensions".producers."laputa-systems/node-build"]
reason = "Its vite, vitest and oxlint steps load napi-rs addons in-process; on glibc runners those loaders pick GNU bindings, which cannot load into node-build's musl node (node-build NODE-6)."
reassess = "When these jobs run on a musl host; node-build NODE-6 is decided: musl node is Alpine-only."

[exempt."joshuarli/stats".producers."laputa-systems/node-build"]
reason = "The statsctl release build runs vite, whose rolldown addon picks its GNU binding on glibc runners and cannot load into node-build's musl node (node-build NODE-6)."
reassess = "When the job runs on a musl host; node-build NODE-6 is decided: musl node is Alpine-only."

