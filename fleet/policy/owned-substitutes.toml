version = 1

[producers."laputa-systems/gluon"]
label = "Meson, Ninja"
urls = ["github.com/ninja-build"]

[producers."laputa-systems/gluon".packages]
apk = ["meson", "ninja", "ninja-build", "samurai"]
apt = ["meson", "ninja-build", "samurai"]
brew = ["meson", "ninja", "samurai"]
dnf = ["meson", "ninja-build", "samurai"]
pacman = ["meson", "ninja", "samurai"]

[producers."laputa-systems/ffmpeg-build"]
label = "FFmpeg runtime and libraries"
urls = ["ffmpeg.org", "johnvansickle.com"]

[producers."laputa-systems/ffmpeg-build".packages]
apk = ["ffmpeg", "ffmpeg-dev"]
apt = ["ffmpeg"]
brew = ["ffmpeg"]
dnf = ["ffmpeg"]
pacman = ["ffmpeg"]

[producers."laputa-systems/cmake-build"]
label = "CMake"
urls = ["cmake.org", "github.com/kitware/cmake"]

[producers."laputa-systems/cmake-build".packages]
apk = ["cmake"]
apt = ["cmake"]
brew = ["cmake"]
dnf = ["cmake"]
pacman = ["cmake"]

[producers."laputa-systems/llvm-prebuilt-musl"]
label = "Clang and LLVM toolchains"
urls = ["apt.llvm.org"]

[producers."laputa-systems/llvm-prebuilt-musl".packages]
apk = ["clang", "lld", "llvm", "^clang-?\\d+$", "^lld-?\\d+$", "^llvm-?\\d+$"]
apt = ["clang", "lld", "llvm", "^clang-\\d+$", "^lld-\\d+$", "^llvm-\\d+$"]
brew = ["llvm", "^llvm@\\d+(\\.\\d+)*$"]
dnf = ["clang", "clang-devel", "clang-tools-extra", "lld", "llvm"]
pacman = ["clang", "clang-tools-extra", "lld", "llvm", "llvm-libs"]

[producers."laputa-systems/node-build"]
label = "Node.js"
actions = ["actions/setup-node"]
urls = ["nodejs.org"]

[producers."laputa-systems/node-build".packages]
apk = ["nodejs", "npm"]
apt = ["nodejs", "npm"]
brew = ["node", "npm", "^node@\\d+(\\.\\d+)*$"]
dnf = ["nodejs", "npm"]
pacman = ["nodejs", "npm"]

[producers."laputa-systems/python-build"]
label = "CPython"
actions = ["actions/setup-python", "astral-sh/setup-uv"]
urls = ["python.org/ftp", "www.python.org/ftp", "github.com/astral-sh/python-build-standalone"]

[producers."laputa-systems/python-build".packages]
apk = ["^python3([.-].*)?$"]
apt = ["^python3([.-].*)?$"]
brew = ["python3", "^python@\\d+(\\.\\d+)*$"]
dnf = ["^python3([.-].*)?$"]
pacman = ["python", "^python3([.-].*)?$"]

[producers."laputa-systems/git-build".packages]
apk = ["git"]
apt = ["git"]
brew = ["git"]
dnf = ["git"]
pacman = ["git"]

[producers."laputa-systems/git-build"]
label = "Git"
urls = ["github.com/git/git"]

[producers."laputa-systems/ssh-build".packages]
apk = ["openssh", "^openssh-.*$"]
apt = ["^openssh-.*$"]
dnf = ["openssh", "^openssh-.*$"]
pacman = ["openssh"]

[producers."laputa-systems/ssh-build"]
label = "OpenSSH"
urls = ["cdn.openbsd.org/pub/openbsd/openssh", "ftp.openbsd.org/pub/openbsd/openssh"]

[producers."laputa-systems/rg".packages]
apk = ["ripgrep"]
apt = ["ripgrep"]
brew = ["ripgrep"]
dnf = ["ripgrep"]
pacman = ["ripgrep"]

[producers."laputa-systems/rg"]
label = "ripgrep"
urls = ["github.com/burntsushi/ripgrep"]

[producers."laputa-systems/fd".packages]
apk = ["fd"]
apt = ["fd-find"]
brew = ["fd"]
dnf = ["fd-find"]
pacman = ["fd"]

[producers."laputa-systems/fd"]
label = "fd"
urls = ["github.com/sharkdp/fd"]

[producers."laputa-systems/jaq".packages]
apk = ["jq"]
apt = ["jq"]
brew = ["jq"]
dnf = ["jq"]
pacman = ["jq"]

[producers."laputa-systems/jaq"]
label = "jaq"
urls = ["github.com/jqlang/jq", "github.com/01mf02/jaq"]

[producers."joshuarli/mold".packages]
apk = ["mold"]
apt = ["mold"]
brew = ["mold"]
dnf = ["mold"]
pacman = ["mold"]

[producers."joshuarli/mold"]
label = "mold"
urls = ["github.com/rui314/mold"]

[producers."joshuarli/shck"]
label = "ShellCheck"
actions = ["ludeeus/action-shellcheck"]
urls = ["github.com/koalaman/shellcheck"]

[producers."joshuarli/shck".packages]
apk = ["shellcheck"]
apt = ["shellcheck"]
brew = ["shellcheck"]
dnf = ["ShellCheck", "shellcheck"]
pacman = ["shellcheck"]

[producers."joshuarli/kache"]
label = "sccache, ccache"
actions = ["mozilla-actions/sccache-action", "hendrikmuhs/ccache-action"]
urls = ["github.com/mozilla/sccache"]

[producers."joshuarli/kache".packages]
apk = ["sccache", "ccache"]
apt = ["sccache", "ccache"]
brew = ["sccache", "ccache"]
dnf = ["sccache", "ccache"]
pacman = ["sccache", "ccache"]

[producers."joshuarli/kache".manifests]
cargo = ["sccache"]

[producers."joshuarli/pytest-parallel"]
label = "pytest-xdist"

[producers."joshuarli/pytest-parallel".manifests]
pypi = ["pytest-xdist"]

[producers."laputa-systems/rustybench"]
label = "criterion, divan"

[producers."laputa-systems/rustybench".manifests]
cargo = ["criterion", "divan"]

[exempt."joshuarli/tf".producers."laputa-systems/python-build"]
reason = "The producer publishes no release for the Python versions tf needs: 3.14 for the pinned unicodedata 16.0.0 its table generator requires, 3.12 for the ComfyUI runtime checks, and a 3.11/3.12 support matrix; python-build ships only 3.15."
reassess = "When python-build publishes the older minors (stuff TODO STUF-123)."

[exempt."laputa-systems/graviola".producers."laputa-systems/rustybench"]
reason = "Effectively upstream fork whose inherited build must stay unchanged: the criterion benchmarks are upstream's, and porting them to rustybench would widen the fork's diff without a fleet consumer."
reassess = "When the fork adds benchmarks of its own, or upstream adopts rustybench."

