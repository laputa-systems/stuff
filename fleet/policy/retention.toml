version = 1

[mutation-lane]
repositories = ["joshuarli/loc", "joshuarli/pi-build", "laputa-systems/buildlib", "laputa-systems/diff-pretty", "laputa-systems/fastermod", "laputa-systems/fz", "laputa-systems/ptytest", "laputa-systems/srv"]

[coverage-target]
repositories = ["joshuarli/extensions", "joshuarli/pi-build", "joshuarli/pytest-parallel", "laputa-systems/buildlib", "laputa-systems/diff-pretty", "laputa-systems/ffmpeg-build", "laputa-systems/fz", "laputa-systems/hi-lite", "laputa-systems/mdevd-rs", "laputa-systems/node-build", "laputa-systems/ptytest", "laputa-systems/srv"]

[strict-profile."laputa-systems/srv"]
settings = ["rust.unsafe_code=forbid"]

[strict-profile."laputa-systems/buildlib"]
settings = ["ty.missing-type-argument=error", "ty.unsound-return-statement=error", "ty.unused-ignore-comment=error", "ruff.ANN401=selected"]

[strict-profile."laputa-systems/ffmpeg-build"]
settings = ["ty.unsound-return-statement=error"]

[strict-profile."joshuarli/pi-build"]
settings = ["ty.missing-type-argument=error"]

[strict-profile."laputa-systems/node-build"]
settings = ["ty.unsound-return-statement=error"]
