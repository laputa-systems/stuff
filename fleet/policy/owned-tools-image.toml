version = 1
reference = "oci.17166969.xyz/owned-tools"
digest = "sha256:aaec19e7a44cbc53b40db2d22093600ee888689b89be94da90e5398ed02f1883"

tools = ["cmake", "cpython", "fd", "ffmpeg-runtime", "git", "gluon", "jaq", "llvm", "mold", "rg"]

# python3/py3-*, build-base, gcc, g++ and musl-dev are deliberately unmapped:
# the image's cpython ships no venv or pip, and the compiler packages carry
# headers and libc dev files the image does not publish. No -dev/-doc suffixes.
# git is unmapped too: git-build omits HTTPS by product decision, so removing the
# distribution git would break any stage that clones or fetches over HTTPS.
[packages.apk]
cmake = "cmake"
ripgrep = "rg"
fd = "fd"
jaq = "jaq"
meson = "gluon"
ninja = "gluon"
ninja-build = "gluon"
samurai = "gluon"
clang = "llvm"
lld = "llvm"
llvm = "llvm"
"^clang-?\\d+$" = "llvm"
"^lld-?\\d+$" = "llvm"
"^llvm-?\\d+$" = "llvm"
mold = "mold"
ffmpeg = "ffmpeg-runtime"
