[overrides."laputa-systems/chromium-build"]
ignore = ["mdtool:R005", "no-formatters"]
ignore_reason = "The macos-native README names Chromium source paths that live in the Chromium checkout. scripts/build-rust-toolchain.sh builds LLVM's clang-format into the Rust toolchain archive because Crubit formats its generated headers with it; the script only checks its version and never formats repository code."

[overrides."laputa-systems/asterinas"]
ignore = ["rust-toolchain", "no-formatters"]
ignore_reason = "Kernel fork rebased onto upstream Asterinas: Laputa builds it offline in upstream's published dev image, so rust-toolchain.toml keeps the nightly that image ships, and upstream's formatter configuration and scripts stay in place to keep rebases conflict-free. The fork's own CI runs no formatter."

[overrides."joshuarli/swift-bylaws"]
ignore = ["make-lint-target", "rust-toolchain"]
ignore_reason = "The Rust and TypeScript sources are upstream editor extensions outside this fork's CLI; Zed builds its extension with its own toolchain."

[overrides."laputa-systems/bbtree"]
ignore = ["rust-toolchain"]
ignore_reason = "Fork whose CI and flake pin the nightly the Verus build needs."

[overrides."laputa-systems/harfrust"]
ignore = ["audit-registry"]
ignore_reason = "Upstream pins harfbuzz_rs by git revision as a test-only comparison dependency; it is not shipped by the library."

[overrides."laputa-systems/rawzip"]
ignore = ["rust-project:lockfile:compare"]
ignore_reason = "compare/ is a development tool for comparing against other zip crates, and the repository ignores Cargo.lock on purpose."

[overrides."laputa-systems/python-build"]
ignore = ["mdtool:D001", "mdtool:P002", "mdtool:R001", "mdtool:R005", "registry-sources:git:ruff_python_parser", "registry-sources:git:rustls", "registry-sources:git:rustls-webpki", "rust-collections"]
ignore_reason = "The Rust CPython overlay pins its parser and TLS forks by git revision. Vendored rustls, webpki, and CPython sources carry \"section N\" text and paths into the CPython tree, the .agents and .claude skill trees repeat skill text on purpose, and the benchmark README names files its commands generate. The serc compiler in rust-cpython relies on BTreeMap and BTreeSet iteration order for deterministic output (sorted free variables, position-ordered boundaries)."

[overrides."laputa-systems/ptytest"]
ignore = ["mdtool:R003", "audit-banned:transitive:polling", "audit-banned:transitive:piper", "audit-banned:transitive:concurrent-queue", "audit-banned:transitive:atomic-waker"]
ignore_reason = "docs/baselines.md quotes the baseline command of another repository. polling, piper, concurrent-queue, and atomic-waker arrive only through the alacritty_terminal dev dependency, the reference terminal for the differential test in src/terminal.rs, which has no smolith fork."

[overrides."laputa-systems/smolith"]
ignore = ["audit-banned:transitive:tokio", "rust-project:lockfile:crates/laputa-h2-futures-lite", "rust-project:lockfile:crates/laputa-h2-futures-lite/util/genfixture", "rust-project:lockfile:crates/laputa-h2-futures-lite/util/genhuff"]
ignore_reason = "Tokio is only reachable through wasm-bindgen-futures (via the wasm-bindgen-test dev dependency) under its opt-in wasm_bindgen_unstable_tokio cfg for wasm32-unknown-emscripten; the wasm32-unknown-unknown test builds never compile it. The vendored h2 fork keeps upstream's own workspace, whose only executables are its fuzz, fixture, and Huffman-table development utilities. The genfixture and genhuff utility crates are sub-workspaces with their own manifests and admit the same call."

[overrides."joshuarli/kache"]
ignore = ["audit-banned:transitive:tokio"]
ignore_reason = "kunobi-daemon declares tokio as an optional dependency behind its async feature, which kache never enables; Cargo.lock records it, but cargo tree finds no tokio in any target or edge kind."

[overrides."joshuarli/defuddle-rs"]
ignore = ["audit-banned:transitive:tokio"]
ignore_reason = "Tokio is only reachable through wasm-bindgen's opt-in wasm_bindgen_unstable_tokio cfg for wasm32-unknown-emscripten; wasm32-unknown-unknown builds never compile it."

[overrides."joshuarli/toolbox"]
ignore = ["registry-sources:path:shadowdriver"]
ignore_reason = "shadowdriver stays private and is never published to stuff, so toolbox keeps its sibling-path dependency on it."

[overrides."laputa-systems/stuff"]
ignore = ["binary-release-tags", "registry-sources", "laputa-rustix"]
ignore_reason = "The registry service must remain buildable when its own package registries are unavailable: cargo, npm, and PyPI dependencies of the registry crates resolve from upstream, and laputa-rustix is only published to the stuff registry, so stuff cannot prefer it. The CLI release keeps the standalone executables that sh dl stuff installs because of the monorepo's Cloudflare Worker."

[overrides."joshuarli/play"]
ignore = ["rust-project:lockfile:vendor/symphonia"]
ignore_reason = "The vendored symphonia fork keeps upstream's own workspace; play locks the crates it consumes, and the remaining members (symphonia-play, symphonia-check, benchtest) are upstream development tools play never builds."

[overrides."joshuarli/pi-build"]
ignore = ["language-tags", "make-lint-target"]
ignore_reason = "sources/ holds preserved upstream TypeScript snapshots that the build packs unchanged; the first-party code is the Python build tooling in tools/, which detection does not reach because those snapshots carry npm manifests. The same detection asks make lint to run oxlint over those snapshots; make lint runs ruff and ty over the build tooling instead."

[overrides."laputa-systems/zzz"]
ignore = ["release-archive-format", "binary-release-standard"]
ignore_reason = "The owner excluded zzz from the tar.xz release-archive campaign: it keeps its zip release archives. binary-release-standard is ignored whole because its archive check, and its fixer, would rewrite the packaging to tar.xz."

[overrides."laputa-systems/xsh"]
ignore = ["make-lint-target"]
ignore_reason = "The owner keeps xsh's make lint as an explicit repair command. Use make check for lint verification."
